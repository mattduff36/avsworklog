# Disposable local PostgreSQL for avsworklog tests only. Loopback-bound; not for production.
services:
  postgres:
    image: postgres:15-bookworm
    restart: "no"
    stop_grace_period: 10s
    environment:
      POSTGRES_USER: avsworklog_test
      POSTGRES_PASSWORD: avsworklog_test_only
      POSTGRES_DB: avsworklog_test
    ports:
      - "127.0.0.1:${AVSWORKLOG_TEST_POSTGRES_PORT:?AVSWORKLOG_TEST_POSTGRES_PORT is required}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "avsworklog_test", "-d", "avsworklog_test"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
